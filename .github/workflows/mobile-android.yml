name: Mobile Android Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web + Sync Capacitor
        run: pnpm mobile:build

      - name: Android Debug Build
        if: matrix.build_type == 'debug'
        run: pnpm mobile:build-android-debug

      - name: Android Release Build
        if: matrix.build_type == 'release'
        run: pnpm mobile:build-android

      - name: Upload Debug APK
        if: matrix.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK (Unsigned)
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  android-signed-release:
    if: >-
      github.event_name != 'pull_request' &&
      secrets.ANDROID_KEYSTORE_BASE64 != '' &&
      secrets.ANDROID_KEYSTORE_PASSWORD != '' &&
      secrets.ANDROID_KEY_ALIAS != '' &&
      secrets.ANDROID_KEY_PASSWORD != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Android Signing Files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Signed Android Release APK
        run: pnpm mobile:build-android-signed

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Cleanup Signing Files
        if: always()
        run: rm -f android/release-keystore.jks android/keystore.properties
